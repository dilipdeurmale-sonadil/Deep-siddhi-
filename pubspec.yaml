name: deepsiddhi
description: दीपसिद्धी (DeepSiddhi) - शिष्यवृत्ती स्मार्ट सराव (इ. ४ थी व ७ वी)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_tts: ^4.0.2
  confetti: ^0.7.0
  # Firebase: flutterfire configure चालवल्यानंतर अनकमेंट करा
  # firebase_core: ^3.1.0
  # cloud_firestore: ^5.0.0
  # firebase_auth: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/DeepSiddhi_Icon_1024x1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/DeepSiddhi_Icon_512x512.png
